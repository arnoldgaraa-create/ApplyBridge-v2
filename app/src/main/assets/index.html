<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplyBridge</title><style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{background:#101828;color:#fff;padding:22px}main{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;margin-bottom:16px}textarea{width:100%;box-sizing:border-box;padding:11px;margin:8px 0 14px;border:1px solid #d0d5dd;border-radius:8px}button{background:#3559d8;color:#fff;border:0;border-radius:8px;padding:11px 15px;font-weight:bold}</style></head><body><header><b>ApplyBridge V3</b><div>Job Application Copilot</div></header><main><div class="card"><h2>Préparer une candidature</h2><label>Offre d'emploi</label><textarea id="offer" rows="8" placeholder="Colle l'offre ici..."></textarea><label>Ton profil / CV</label><textarea id="profile" rows="6" placeholder="Colle ton profil ici..."></textarea><button onclick="go()">Analyser</button></div><div class="card"><h3>Analyse</h3><pre id="out" style="white-space:pre-wrap">Prêt.</pre></div></main><script>function go(){let o=document.getElementById('offer').value.toLowerCase(),p=document.getElementById('profile').value.toLowerCase();let w=[...new Set((o.match(/[a-zà-ÿ0-9+#.-]{5,}/g)||[]))].slice(0,20);let m=w.filter(x=>!p.includes(x)).slice(0,8);document.getElementById('out').textContent='Mots-clés détectés:\n• '+w.join('\n• ')+'\n\nÀ vérifier:\n• '+(m.join('\n• ')||'Aucun manque évident.');}</script></body></html>

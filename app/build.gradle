plugins { id 'com.android.application' }

android {
    namespace 'com.applybridge.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.applybridge.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '3.0.0'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
